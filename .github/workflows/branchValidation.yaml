name: Branch Validation

on:
  create:

jobs:
  validate-branch:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Validate branch name
        id: validate
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          echo "Validating branch: $BRANCH_NAME"
          VALID=false
          if [[ $BRANCH_NAME =~ ^dev/.+ ]]; then
            VALID=true
            echo "✓ Valid dev branch"
          elif [[ $BRANCH_NAME =~ ^bugfix/[A-Z]+-[0-9]+_.+ ]]; then
            VALID=true
            echo "✓ Valid bugfix branch"
          elif [[ $BRANCH_NAME =~ ^feature/[A-Z]+-[0-9]+_.+ ]]; then
            VALID=true
            echo "✓ Valid feature branch"
          elif [[ $BRANCH_NAME =~ ^release/PI[0-9]+_S[0-9]+$ ]]; then
            VALID=true
            echo "✓ Valid release branch (PI format)"
          elif [[ $BRANCH_NAME =~ ^release/CL[0-9]+_[0-9]{4}_[0-9]{2}_[0-9]{2}_.+ ]]; then
            VALID=true
            echo "✓ Valid release branch (CL format)"
          elif [[ $BRANCH_NAME =~ ^production/.+ ]]; then
            VALID=true
            echo "✓ Valid production branch"
          fi
          
          if [ "$VALID" = false ]; then
            echo "valid=false" >> $GITHUB_OUTPUT
            echo "❌ Invalid branch name: $BRANCH_NAME"
            echo "Branch does not match any valid naming pattern"
            exit 1
          else
            echo "valid=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Delete invalid branch
        if: failure()
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          echo "Deleting invalid branch: $BRANCH_NAME"
          
          curl -X DELETE \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/git/refs/heads/$BRANCH_NAME"
          
          echo "❌ Branch '$BRANCH_NAME' has been deleted due to invalid naming pattern"
